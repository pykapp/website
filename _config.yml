# This folder is the site at https://peopleyouk.now/. It is not built from
# here: .github/workflows/pages.yml copies it into pykapp/website on every
# merge to main, and GitHub Pages builds that repository's root. CNAME beside
# this file is what keeps the domain there: the copy deletes whatever is not in
# docs/, so a CNAME that GitHub wrote into that repository itself would be
# gone at the next merge, and the site with it. The
# three policy documents and the guide under guide/ are the site; the store copy
# beside them is not published. Adding a page here publishes it, which is what
# scripts/site-links-resolve.sh is for.
#
# What is not a page: assets/ and favicon.ico, which are generated from the
# app's own drawables, palette and font by scripts/render-site-assets.sh and
# held to them by scripts/the-site-wears-the-mark.py. assets/main.scss is
# minima's own documented override point and is compiled to assets/main.css by
# the front matter at the top of it; nothing else here is Sass.
#
# It speaks the languages the app speaks, which is not a courtesy: the app has
# had a language row since the seventh interlude after M12, and a French phone
# that follows `Links.TERMS` has always landed on English. The set is the app's
# and is held to it by scripts/site-speaks-what-the-app-speaks.sh, because two
# lists of languages in two trees drift the first time one of them grows.
title: people you know
description: Private photo sharing with the people you actually know.
theme: minima

# English by a decision of this repository rather than by minima's last resort.
# There was no `lang` key here until the site learned a second language, so all
# fourteen pages were served `lang="en"` out of the theme's own default
# (`_layouts/default.html`: `page.lang | default: site.lang | default: "en"`),
# which is the feed tabs being Material's purple one surface over—correct, and
# nobody's choice. `url` and `baseurl` are here because hreflang needs absolute
# addresses and `absolute_url` reads them; nothing else on the site did.
lang: en
url: https://peopleyouk.now
baseurl: ""

# One entry adds a language, and nothing else on the site is edited to add one.
#
# `code` is the BCP-47 primary subtag and is the app's: `Spoken.subtag` in
# shared/.../usecases/Language.kt is the oracle, and CI compares them, because
# `code` is the only field here a browser, a screen reader or a crawler reads.
# `spoken` names the `Spoken` case, which is what makes that comparison a set
# check in both directions. `name` is the word the app's own dialog uses, in
# that language and never translated (§14): `English` keeps its capital because
# it is a proper noun in English, `français` does not because it is not one in
# French, and the ground for the rule is reachability—somebody who reads only
# French has to find their language on a page they cannot otherwise read.
# `incise` is the dash that language sets an aside with, and the two differ.
# English closes an em dash against the words (CLAUDE.md: word—word, never
# word — word). French sets a demi-cadratin with ordinary spaces either side,
# which is the commonest modern French incise and is a DIFFERENT CHARACTER, so
# the em dash rule is untouched rather than excepted. Each page is held to its
# own language's dash and to no other's, which is what catches the English
# habit being carried into French prose by somebody translating quickly.
# `label` is that row's name for a screen reader, in that language for the same
# reason `name` is: a hard-coded English `aria-label` on a French page is the
# one word on it nobody translated. `dir` is the URL prefix, empty for the language that holds the root. English
# holds it for Language.kt's own reason: it is the fallback rather than a
# preference, so it is the one that is certainly complete—and `Links.TERMS` is
# compiled into every binary ever shipped, so moving English under a prefix
# would strand them while `/fr/` strands nothing. `complete` says whether the
# translation is finished; false permits any subset, and flipping it to true is
# the one line that turns the mirror check on.
languages:
  - code: en
    spoken: English
    name: English
    label: language
    incise: "—"
    dir: ""
    complete: true
  - code: fr
    spoken: French
    name: français
    label: langue
    incise: "–"
    dir: fr
    complete: true

# THE SCOPE IS MATCHED AGAINST THE SOURCE PATH, which is worth writing down
# because `Page#dir` is the URL directory and reads like the answer. It is not
# the one used: `Page#initialize` sets `data.default_proc` to
# `frontmatter_defaults.find(relative_path, ...)`, and `relative_path` is
# `join(@dir, @name)` over the @dir the page was CONSTRUCTED with, which is
# where the file lives. So `path: "fr"` catches docs/fr/index.md because of the
# directory it is in, and a page's language follows the folder rather than the
# address. (Read out of jekyll/page.rb and frontmatter_defaults.rb at v4.3.3;
# no Jekyll runs in this repository, so it is sourced rather than observed.)
#
# The sharp consequence, and what site-links-resolve.sh guards: a French page
# that lives OUTSIDE docs/fr/ while being published under /fr/ renders
# `lang="en"` with a French address, green all the way. The rule that the
# directory and the permalink agree is what makes the folder and the URL say
# the same thing.
#
# `image` is the Open Graph card, and it is a `defaults` value because
# jekyll-seo-tag reads `page.image` and NOTHING ELSE—there is no `site.image`
# fallback in 2.8.0 (`ImageDrop#image_hash` reads `page["image"]`, full stop),
# so a key at the top of this file would be silently ignored and every link to
# the site would unfurl as a bare title on a grey rectangle, which is what it
# did until this line. Through `defaults` every page inherits it, including the
# French ones: the stanza below overrides `lang` and nothing else. It is the
# mark and the wordmark and no words, so it needs no translation.
#
# This is also why there is no `<link rel="icon">` anywhere: seo-tag emits
# `og:image` into a head we do not write, and it emits no favicon. The site's
# icon is docs/favicon.ico at the root, which every browser asks for unprompted.
defaults:
  - scope:
      path: ""
    values:
      layout: doc
      lang: en
      image: /assets/og.png
  - scope:
      path: "fr"
    values:
      lang: fr

# Documents that exist in the default language and in no other, because they are
# DRAFTED rather than translated: a policy is a legal document whose wording is
# the thing that binds. CI asserts each exists in the default language AND IN NO
# OTHER, since nothing goes red on its own when somebody publishes an unreviewed
# translation of a document people agree to.
#
# The list is empty, and that is a decision rather than an oversight. All four
# documents exist in both languages, and neither version calls itself a
# courtesy: the terms say plainly that the French is the version binding a
# consumer in Québec, which is what Québec's French-first rule for a contract of
# adhesion requires, and `Links` in the app resolves to the French document when
# the app is in French so that the version that binds is the one remitted.
#
# What that costs is on the open register and not hidden here: the French was
# TRANSLATED and not DRAFTED, so the text binding a Québec consumer was written
# by somebody without a licence. One review before release covers both
# languages, which is why it sits with the LLC rather than after launch.
drafted_not_translated:
# The two files that say the apps may use passkeys for this website (DESIGN.md
# §6): `assetlinks.json` names the Android app and the certificates it is
# signed with, and `apple-app-site-association` names the iPhone app. Jekyll
# leaves out every folder whose name starts with a dot unless it is named here.
# The server holds the same names and certificates, and `PasskeyHomeTest` holds
# the two to each other.
include:
  - .well-known
exclude:
  - store
  - README.md
# Inert at minima 2.5.1, which is what github-pages 232 ships and what this
# site is built against: skins arrived in minima 3, and 2.5.1's `_sass/minima.scss`
# imports `minima/base`, `minima/layout` and `minima/syntax-highlighting` with no
# skin in the path at all. It is kept rather than deleted because `classic` is
# what the site looks like today, so a Pages bump to minima 3 changes the theme
# under us in every other respect but not this one. The site's own colours are
# not here: they are in assets/main.scss, out of the app's sources.
minima:
  skin: classic
# Minima renders ONE masthead for the whole site, so these five English entries
# are the nav on a French page too. That is a real cost and it is the least bad
# of three: `[]` makes minima list every page on the site in every language,
# because Liquid's `default` filter fires on anything answering `empty?` and
# header.html falls back to `site.pages | map: "path"`; and the only clean fix
# is shadowing `_includes/header.html`, a frozen copy of somebody else's file
# with no test, which is refused here for the reason head.html is. Named in
# design/90-decisions-on-record/1670 rather than hidden.
header_pages:
  - guide/index.md
  - policies/terms.md
  - policies/privacy.md
  - policies/moderation.md
  - delete-account.md
